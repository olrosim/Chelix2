<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точная верстка (80% + 3px)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0; 
            height: 100vh;
            overflow: hidden; 
            font-family: sans-serif;
        }

        .container {
            width: 100%; 
            max-width: 400px; 
            height: 100%; 
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Базовый стиль для всех синих блоков */
        .blue-image {
            width: 100%;
            background-color: #0022ff; 
            position: relative; /* ВАЖНО: чтобы вложенные элементы считались от краев этого блока */
        }

        /* ПЕРВЫЙ БЛОК: Высота ровно 80% от ширины */
        .blue-1 {
            aspect-ratio: 1 / 0.8; 
            flex-shrink: 0;        
        }

        /* Остальные синие блоки: делят оставшееся пространство */
        .blue-2 { flex-grow: 1; }
        
        /* Блок 3 и 4: Теперь равные */
        .blue-3 { flex-grow: 1.5; }
        .blue-4 { flex-grow: 1.5; }
        
        /* Блок 5: на 15% меньше своего прежнего значения (было 1, стало 0.85) */
        .blue-5 { flex-grow: 0.85; }

        /* БЕЛЫЕ РАЗДЕЛИТЕЛИ: строго 3 пикселя */
        .divider {
            width: 100%;
            height: 3px; 
            background-color: #ffffff;
            flex-shrink: 0; 
        }

        /* ===== ТИПЫ ЭЛЕМЕНТОВ ДЛЯ ПЕРВОГО БЛОКА ===== */
        .text-green {
            position: absolute;
            background-color: #00ff00;
            color: #000;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-red {
            position: absolute;
            background-color: #a52a2a;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* ===== ТИПЫ ЭЛЕМЕНТОВ ДЛЯ ВТОРОГО БЛОКА ===== */
        .img-link-orange {
            background-color: #ff6600;
            cursor: pointer;
            width: 63px;
            height: 63px;
            position: relative;
        }

        .text-green-inside-orange {
            position: absolute;
            background-color: #00ff00;
            color: #000;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10px;
        }

        /* Flexbox контейнер для блока 2 */
        .orange-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 12px;
        }

        /* ===== ТИПЫ ЭЛЕМЕНТОВ ДЛЯ ТРЕТЬЕГО БЛОКА ===== */
        .img-blue {
            position: absolute;
            background-color: #4a90e2;
        }

        /* ===== ТИПЫ ЭЛЕМЕНТОВ ДЛЯ ТРЕТЬЕГО БЛОКА (в процентах) ===== */
        .text-green-3 {
            position: absolute;
            background-color: #00ff00;
            color: #000;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-red-3 {
            position: absolute;
            background-color: #a52a2a;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .img-blue-3 {
            position: absolute;
            background-color: #4a90e2;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ===== БЛОК 1 ===== -->
        <div class="blue-image blue-1">
            <!-- 1. Верхний левый зеленый -->
            <div class="text-green" style="top: 6%; left: 4.8%; width: 28%; height: 11.6%;">Hello-1</div>
            
            <!-- 2. Три зеленых справа вверху -->
            <div class="text-green" style="top: 6%; right: 4%; width: 11.2%; height: 7.3%;">Hello-2</div>
            <div class="text-green" style="top: 6%; right: 16%; width: 11.2%; height: 7.3%;">Hello-3</div>
            <div class="text-green" style="top: 6%; right: 28%; width: 11.2%; height: 7.3%;">Hello-4</div>
            
            <!-- 3. Большой зеленый -->
            <div class="text-green" style="top: 50%; left: 4.8%; width: 34.6%; height: 26.6%;">Hello-5</div>
            
            <!-- 4. Средний зеленый (под большим) -->
            <div class="text-green" style="top: 79.3%; left: 4.8%; width: 34.6%; height: 10%;">Hello-6</div>
            
            <!-- 5. Красный (ссылка) -->
            <a href="#" class="link-red" style="top: 91.6%; left: 4.8%; width: 26.6%; height: 8.3%;">Link-1</a>
        </div>
        <div class="divider"></div>

        <!-- ===== БЛОК 2 ===== -->
        <div class="blue-image blue-2">
            <div class="orange-container" style="top: 10%; left: 50%; transform: translate(-50%, -50%); width: 16.8%; height: 63%; gap: 3.2%;">
                <a href="#" class="img-link-orange" style="top: 0;">
                    <div class="text-green-inside-orange" style="height: 15.8%;">Hello-7</div>
                </a>
                <a href="#" class="img-link-orange">
                    <div class="text-green-inside-orange" style="height: 15.8%;">Hello-8</div>
                </a>
                <a href="#" class="img-link-orange">
                    <div class="text-green-inside-orange" style="height: 15.8%;">Hello-9</div>
                </a>
                <a href="#" class="img-link-orange">
                    <div class="text-green-inside-orange" style="height: 15.8%;">Hello-10</div>
                </a>
            </div>
        </div>
        <div class="divider"></div>

        <!-- ===== БЛОК 3 ===== -->
        <div class="blue-image blue-3">
            <!-- 1. Верхний правый зеленый -->
            <div class="text-green-3" style="top: 3%; right: 8%; width: 15%; height: 9%;">Hello-11</div>
            
            <!-- 2. Большой центральный зеленый -->
            <div class="text-green-3" style="top: 19%; left: 23%; width: 39%; height: 37%;">Hello-12</div>
            
            <!-- 3. Красный (ссылка) -->
            <a href="#" class="link-red-3" style="top: 66%; left: 23%; width: 23%; height: 13%;">Link-2</a>
            
            <!-- 4. Голубые (картинки) 4 шт -->
            <div class="img-blue-3" style="top: 16%; right: 4%; width: 9%; height: 9%;"></div>
            <div class="img-blue-3" style="top: 38%; right: 4%; width: 9%; height: 9%;"></div>
            <div class="img-blue-3" style="top: 59%; right: 4%; width: 9%; height: 9%;"></div>
            <div class="img-blue-3" style="top: 81%; right: 4%; width: 9%; height: 9%;"></div>
            
            <!-- 5. Зеленые тексты 4 шт -->
            <div class="text-green-3" style="top: 16%; right: 15%; width: 20%; height: 9%;">Hello-13</div>
            <div class="text-green-3" style="top: 38%; right: 15%; width: 20%; height: 9%;">Hello-14</div>
            <div class="text-green-3" style="top: 59%; right: 15%; width: 20%; height: 9%;">Hello-15</div>
            <div class="text-green-3" style="top: 81%; right: 15%; width: 20%; height: 9%;">Hello-16</div>
        </div>
        <div class="divider"></div>

        <!-- Блок 4 (пока пустой) -->
        <div class="blue-image blue-4"></div>
        <div class="divider"></div>

        <!-- Блок 5 (пока пустой) -->
        <div class="blue-image blue-5"></div>

    </div>

</body>
</html>

  :root{
    --design-w: 375;
    --blue: rgb(0,57,255);
    --green: rgb(0,255,18);
    --orange: rgb(255,126,0);
    --light-blue: rgb(0,120,255);
    --red: rgb(161,42,42);
    --white: rgb(255,255,255);
    --transparent: transparent; /* 👈 добавляем прозрачный */
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--blue)}
  body{
    min-width:320px;
    font-family:Arial,Helvetica,sans-serif;
  }

  /*
    All geometry is based on the supplied 375x812 reference.
    1 design pixel = 100vw / 375.
    Therefore a 390px phone automatically scales every coordinate
    by 390/375 without changing proportions.
  */
  .page{
    position:relative;
    width:100%;
    overflow:hidden;
    background:var(--blue);
  }

  .section{
    position:relative;
    width:100%;
  }

  .s1 {
  height: 91.733333vw;
  background-image: url('https://github.com/olrosim/Chelix2/blob/main/dadada.png?raw=true');   
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
  .s2{height:24.266667vw} /* 91/375 */
  .s3{height:38.666667vw} /* 145/375 */
  .s4{height:38.333333vw} /* 125/375 */
  .s5{height:25.333333vw} /* 95/375 */

  .divider{
    position:absolute;
    left:0;
    width:100%;
    height:.8vw; /* 3px / 375 */
    background:var(--white);
  }

  /* Generic exact-position block */
  .block{
    position:absolute;
    margin:0;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3vw;
    font-weight:bold;
    color:rgba(255,255,255,0.8);
    text-shadow:0 0 5px rgba(0,0,0,0.5);
  }

  .green{background:var(--green)}
  .orange{background:var(--orange)}
  .lblue{background:var(--light-blue)}
  .red{background:var(--red)}
  .white{background:var(--white)}
  .transparent{background:var(--transparent)}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точная верстка (адаптив)</title>
    <style>
        /* Сброс отступов для точности */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Тело на всю высоту экрана, без прокрутки */
        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0; 
            height: 100vh; /* Важно! Занимает ровно высоту экрана */
            overflow: hidden; /* Скрываем прокрутку, так как все влезает */
            font-family: sans-serif;
        }

        /* Основной контейнер */
        .container {
            width: 100%; /* Занимает всю ширину экрана */
            max-width: 400px; /* Максимальная ширина, если открыть на компе */
            height: 100%; /* Растягивается на всю высоту */
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* СИНИЕ БЛОКИ */
        .blue-image {
            width: 100%;
            background-color: #0022ff; 
        }

        /* Высоты в процентах, чтобы всё влезало на экран без скролла */
        .blue-1 { height: 45%; }   /* Самый большой блок */
        .blue-2 { height: 15%; }
        .blue-3 { height: 18%; }
        .blue-4 { height: 16%; }
        .blue-5 { height: 10%; }

        /* БЕЛЫЕ РАЗДЕЛИТЕЛИ */
        .divider {
            width: 100%;
            height: 2%; /* Толщина тоже в процентах (или можно оставить 8px) */
            background-color: #ffffff;
        }

        /* БЕЛЫЕ ПОЛОСКИ */
        .white-strip {
            width: 100%;
            height: 5%; /* Высота декоративной полоски */
            background-color: #ffffff;
        }

        .white-strip-1 {
            border-bottom: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Блок 1 -->
        <div class="blue-image blue-1"></div>
        
        <!-- Разделитель -->
        <div class="divider"></div>

        <!-- Белая полоска -->
        <div class="white-strip white-strip-1"></div>

        <!-- Блок 2 -->
        <div class="blue-image blue-2"></div>
        
        <div class="divider"></div>

        <!-- Блок 3 -->
        <div class="blue-image blue-3"></div>

        <div class="divider"></div>

        <!-- Блок 4 -->
        <div class="blue-image blue-4"></div>

        <div class="divider"></div>

        <!-- Блок 5 -->
        <div class="blue-image blue-5"></div>

    </div>

</body>
</html>

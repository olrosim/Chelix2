<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точная верстка (поэтапно)</title>
    <style>
        /* Сброс отступов для точности */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0; /* Фон страницы, чтобы видеть границы */
            font-family: sans-serif;
        }

        /* Основной контейнер */
        .container {
            width: 400px; /* Ширина колонки. Можно изменить на нужную вам */
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* СИНИЕ БЛОКИ (Заглушки под изображения) */
        .blue-image {
            width: 100%;
            background-color: #0022ff; /* Тот самый синий цвет */
            /* Пока ставим фиксированную высоту, как на вашем скриншоте */
            /* Верхний блок самый большой */
        }

        .blue-1 { height: 350px; }
        .blue-2 { height: 120px; }
        .blue-3 { height: 160px; }
        .blue-4 { height: 140px; }
        .blue-5 { height: 100px; }

        /* БЕЛЫЕ РАЗДЕЛИТЕЛИ (Тонкие линии) */
        .divider {
            width: 100%;
            height: 8px; /* Толщина разделителя в пикселях */
            background-color: #ffffff;
        }

        /* БЕЛЫЕ ПОЛОСКИ-ИЗОБРАЖЕНИЯ (Декоративные вставки) */
        /* Вы сказали, что белым тоже будут изображения в виде красивых полосок.
           Пока это просто белые прямоугольники. */
        .white-strip {
            width: 100%;
            height: 30px; /* Высота декоративной полоски */
            background-color: #ffffff;
            /* Сюда потом можно добавить border, gradient или фон-картинку */
        }

        /* Пример для первой "красивой" полоски под верхним синим блоком, 
           если она нужна там, а не просто пустой зазор */
        .white-strip-1 {
            height: 25px;
            border-bottom: 1px solid #e0e0e0; /* Еле заметная тень для визуального разделения */
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Блок 1 (Самый большой синий) -->
        <div class="blue-image blue-1"></div>
        
        <!-- Разделитель -->
        <div class="divider"></div>

        <!-- Белая декоративная полоска (изображение) -->
        <div class="white-strip white-strip-1"></div>

        <!-- Разделитель (если нужен между полоской и следующим блоком) -->
        <div class="divider"></div>

        <!-- Блок 2 -->
        <div class="blue-image blue-2"></div>
        
        <div class="divider"></div>

        <!-- Блок 3 -->
        <div class="blue-image blue-3"></div>

        <div class="divider"></div>

        <!-- Блок 4 -->
        <div class="blue-image blue-4"></div>

        <div class="divider"></div>

        <!-- Блок 5 -->
        <div class="blue-image blue-5"></div>

    </div>

</body>
</html>

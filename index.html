<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Artist Portfolio — Mobile Layout</title>
<style>
  :root{
    --design-w: 375;
    --blue: rgb(0,57,255);
    --green: rgb(0,255,18);
    --orange: rgb(255,126,0);
    --light-blue: rgb(0,120,255);
    --red: rgb(161,42,42);
    --white: rgb(255,255,255);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--blue)}
  body{
    min-width:320px;
    font-family:Arial,Helvetica,sans-serif;
  }

  /*
    All geometry is based on the supplied 375x812 reference.
    1 design pixel = 100vw / 375.
    Therefore a 390px phone automatically scales every coordinate
    by 390/375 without changing proportions.
  */
  .page{
    position:relative;
    width:100%;
    overflow:hidden;
    background:var(--blue);
  }

  .section{
    position:relative;
    width:100%;
  }

  .s1{height:91.733333vw} /* 344/375 */
  .s2{height:24.266667vw} /* 91/375 */
  .s3{height:38.666667vw} /* 145/375 */
  .s4{height:33.333333vw} /* 125/375 */
  .s5{height:25.333333vw} /* 95/375 */

  .divider{
    position:absolute;
    left:0;
    width:100%;
    height:.8vw; /* 3px / 375 */
    background:var(--white);
  }

  /* Generic exact-position block */
  .block{
    position:absolute;
    margin:0;
    padding:0;
  }

  .green{background:var(--green)}
  .orange{background:var(--orange)}
  .lblue{background:var(--light-blue)}
  .red{background:var(--red)}
  .white{background:var(--white)}

  /* ---------- SECTION 1: 0..344 ---------- */

</style>
</head>
<body>
<main class="page">

  <section class="section s1">
    <div class="block green logo"></div>
    <div class="block green nav1"></div>
    <div class="block green nav2"></div>
    <div class="block green nav3"></div>

  <section class="section s2">

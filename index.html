<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точная верстка (3px разделители)</title>
    <style>
        /* Сброс отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Занимаем ровно высоту экрана, без прокрутки */
        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0; 
            height: 100vh;
            overflow: hidden; 
            font-family: sans-serif;
        }

        /* Основной контейнер */
        .container {
            width: 100%; 
            max-width: 400px; 
            height: 100%; 
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* СИНИЕ БЛОКИ (Заглушки под изображения) */
        .blue-image {
            width: 100%;
            background-color: #0022ff; 
            flex-grow: 1; /* Главное изменение: блоки растягиваются, чтобы занять всё оставшееся место */
        }

        /* Примерные пропорции синих блоков относительно друг друга */
        .blue-1 { flex-grow: 3; }  /* Самый большой */
        .blue-2 { flex-grow: 1; }
        .blue-3 { flex-grow: 1.5; }
        .blue-4 { flex-grow: 1.2; }
        .blue-5 { flex-grow: 1; }

        /* БЕЛЫЕ РАЗДЕЛИТЕЛИ - СТРОГО 3 ПИКСЕЛЯ */
        .divider {
            width: 100%;
            height: 3px; /* Фиксированные 3 пикселя */
            background-color: #ffffff;
            flex-shrink: 0; /* Запрещаем сжиматься при нехватке места */
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Блок 1 -->
        <div class="blue-image blue-1"></div>
        <div class="divider"></div>

        <!-- Блок 2 -->
        <div class="blue-image blue-2"></div>
        <div class="divider"></div>

        <!-- Блок 3 -->
        <div class="blue-image blue-3"></div>
        <div class="divider"></div>

        <!-- Блок 4 -->
        <div class="blue-image blue-4"></div>
        <div class="divider"></div>

        <!-- Блок 5 -->
        <div class="blue-image blue-5"></div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точная верстка (80% + 3px)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0; 
            height: 100vh;
            overflow: hidden; 
            font-family: sans-serif;
        }

        .container {
            width: 100%; 
            max-width: 400px; 
            height: 100%; 
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Базовый стиль для всех синих блоков */
        .blue-image {
            width: 100%;
            background-color: #0022ff; 
        }

        /* ПЕРВЫЙ БЛОК: Высота ровно 80% от ширины */
        .blue-1 {
            aspect-ratio: 1 / 0.8; /* Ширина / Высота = 1 / 0.8 */
            flex-shrink: 0;        /* Запрещаем сжиматься */
        }

        /* Остальные синие блоки: делят оставшееся пространство */
        .blue-2 { flex-grow: 1; }
        
        /* Блок 3 и 4: Теперь равные */
        .blue-3 { flex-grow: 1.5; }
        .blue-4 { flex-grow: 1.5; }
        
        /* Блок 5: на 15% меньше своего прежнего значения (было 1, стало 0.85) */
        .blue-5 { flex-grow: 0.85; }

        /* БЕЛЫЕ РАЗДЕЛИТЕЛИ: строго 3 пикселя */
        .divider {
            width: 100%;
            height: 3px; 
            background-color: #ffffff;
            flex-shrink: 0; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок 1 -->
        <div class="blue-image blue-1"></div>
        <div class="divider"></div>

        <!-- Блок 2 -->
        <div class="blue-image blue-2"></div>
        <div class="divider"></div>

        <!-- Блок 3 -->
        <div class="blue-image blue-3"></div>
        <div class="divider"></div>

        <!-- Блок 4 -->
        <div class="blue-image blue-4"></div>
        <div class="divider"></div>

        <!-- Блок 5 -->
        <div class="blue-image blue-5"></div>
    </div>

</body>
</html>

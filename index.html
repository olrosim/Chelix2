<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точная верстка (80% + 3px + Точный контент)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0; 
            height: 100vh;
            overflow: hidden; 
            font-family: sans-serif;
        }

        .container {
            width: 100%; 
            max-width: 400px; 
            height: 100%; 
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Базовый стиль для всех синих блоков */
        .blue-image {
            width: 100%;
            background-color: #0022ff; 
            position: relative; /* ВАЖНО для точного позиционирования */
        }

        .blue-1 {
            aspect-ratio: 1 / 0.8; 
            flex-shrink: 0;        
        }

        .blue-2 { flex-grow: 1; }
        .blue-3 { flex-grow: 1.5; }
        .blue-4 { flex-grow: 1.5; }
        .blue-5 { flex-grow: 0.85; }

        .divider {
            width: 100%;
            height: 3px; 
            background-color: #ffffff;
            flex-shrink: 0; 
        }

        /* ===== ТИПЫ ЭЛЕМЕНТОВ ===== */
        .text-green {
            position: absolute;
            background-color: #00ff00;
            color: #000;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-red {
            position: absolute;
            background-color: #a52a2a;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .img-link-orange {
            position: absolute;
            background-color: #ff6600;
            cursor: pointer;
        }

        .img-blue {
            position: absolute;
            background-color: #4a90e2;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ===== БЛОК 1 ===== -->
        <div class="blue-image blue-1">
            <div class="text-green" style="top: 10px; left: 10px; width: 100px; height: 30px;">Hello</div>
            
            <div class="text-green" style="top: 10px; right: 10px; width: 40px; height: 20px;">Hello</div>
            <div class="text-green" style="top: 10px; right: 55px; width: 40px; height: 20px;">Hello</div>
            <div class="text-green" style="top: 10px; right: 100px; width: 40px; height: 20px;">Hello</div>
            
            <div class="text-green" style="top: 145px; left: 10px; width: 120px; height: 70px;">Hello World</div>
            <div class="text-green" style="top: 220px; left: 10px; width: 120px; height: 25px;">Hello</div>
            <a href="#" class="link-red" style="top: 255px; left: 10px; width: 80px; height: 20px;">Link</a>
        </div>
        <div class="divider"></div>

        <!-- ===== БЛОК 2 ===== -->
        <div class="blue-image blue-2">
            <a href="#" class="img-link-orange" style="top: 14px; left: 6px; width: 82px; height: 75px;">
                <div class="text-green" style="bottom: 0; left: 0; width: 100%; height: 8px;">Hello</div>
            </a>
            <a href="#" class="img-link-orange" style="top: 14px; left: 94px; width: 82px; height: 75px;">
                <div class="text-green" style="bottom: 0; left: 0; width: 100%; height: 8px;">Hello</div>
            </a>
            <a href="#" class="img-link-orange" style="top: 14px; left: 182px; width: 82px; height: 75px;">
                <div class="text-green" style="bottom: 0; left: 0; width: 100%; height: 8px;">Hello</div>
            </a>
            <a href="#" class="img-link-orange" style="top: 14px; left: 270px; width: 82px; height: 75px;">
                <div class="text-green" style="bottom: 0; left: 0; width: 100%; height: 8px;">Hello</div>
            </a>
        </div>
        <div class="divider"></div>

        <!-- ===== БЛОК 3 ===== -->
        <div class="blue-image blue-3">
            <div class="text-green" style="top: 15px; left: 10px; width: 80px; height: 20px;">Hello</div>
            
            <div class="text-green" style="top: 40px; left: 90px; width: 130px; height: 60px;">Hello World</div>
            <div class="text-green" style="top: 105px; left: 90px; width: 130px; height: 25px;">Hello</div>
            <a href="#" class="link-red" style="top: 135px; left: 90px; width: 70px; height: 15px;">Link</a>
            
            <div class="img-blue" style="top: 15px; right: 15px; width: 40px; height: 25px;"></div>
            <div class="img-blue" style="top: 50px; right: 15px; width: 40px; height: 25px;"></div>
            <div class="img-blue" style="top: 85px; right: 15px; width: 40px; height: 25px;"></div>
            <div class="img-blue" style="top: 120px; right: 15px; width: 40px; height: 25px;"></div>
            
            <div class="text-green" style="top: 120px; right: 5px; width: 25px; height: 15px;">Hello</div>
        </div>
        <div class="divider"></div>

        <!-- ===== БЛОК 4 ===== -->
        <div class="blue-image blue-4">
            <!-- Список слева -->
            <div class="text-green" style="top: 10px; left: 15px; width: 60px; height: 15px;">Hello</div>
            <div class="img-blue" style="top: 35px; left: 15px; width: 30px; height: 30px;"></div>
            <div class="img-blue" style="top: 35px; left: 50px; width: 30px; height: 30px;"></div>
            <div class="img-blue" style="top: 35px; left: 85px; width: 30px; height: 30px;"></div>
            
            <div class="text-green" style="top: 75px; left: 15px; width: 60px; height: 15px;">Hello</div>
            <div class="img-blue" style="top: 100px; left: 15px; width: 30px; height: 30px;"></div>
            <div class="img-blue" style="top: 100px; left: 50px; width: 30px; height: 30px;"></div>
            <div class="img-blue" style="top: 100px; left: 85px; width: 30px; height: 30px;"></div>
            
            <!-- Правая часть -->
            <div class="text-green" style="top: 10px; right: 60px; width: 80px; height: 20px;">Hello</div>
            <a href="#" class="link-red" style="top: 40px; right: 60px; width: 80px; height: 20px;">Link</a>
            
            <div class="img-blue" style="top: 75px; right: 15px; width: 55px; height: 45px;"></div>
            <div class="img-blue" style="top: 125px; right: 15px; width: 25px; height: 10px;"></div>
        </div>
        <div class="divider"></div>

        <!-- ===== БЛОК 5 ===== -->
        <div class="blue-image blue-5">
            <div class="text-green" style="top: 5px; left: 15px; width: 70px; height: 20px;">Hello</div>
            <div class="text-green" style="top: 30px; left: 15px; width: 70px; height: 15px;">Hello</div>
            <a href="#" class="link-red" style="top: 55px; left: 15px; width: 50px; height: 15px;">Link</a>
            
            <div class="img-blue" style="top: 55px; right: 20px; width: 35px; height: 20px;"></div>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точная верстка (80% + 3px)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            background-color: #f0f0f0; 
            height: 100vh;
            overflow: hidden; 
            font-family: sans-serif;
        }

        .container {
            width: 100%; 
            max-width: 400px; 
            height: 100%; 
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Базовый стиль для всех синих блоков */
        .blue-image {
            width: 100%;
            background-color: #0022ff; 
            position: relative; /* ВАЖНО: чтобы вложенные элементы считались от краев этого блока */
        }

        /* ПЕРВЫЙ БЛОК: Высота ровно 80% от ширины */
        .blue-1 {
            aspect-ratio: 1 / 0.8; 
            flex-shrink: 0;        
        }

        /* Остальные синие блоки: делят оставшееся пространство */
        .blue-2 { flex-grow: 1; }
        
        /* Блок 3 и 4: Теперь равные */
        .blue-3 { flex-grow: 1.5; }
        .blue-4 { flex-grow: 1.5; }
        
        /* Блок 5: на 15% меньше своего прежнего значения (было 1, стало 0.85) */
        .blue-5 { flex-grow: 0.85; }

        /* БЕЛЫЕ РАЗДЕЛИТЕЛИ: строго 3 пикселя */
        .divider {
            width: 100%;
            height: 3px; 
            background-color: #ffffff;
            flex-shrink: 0; 
        }

        /* ===== ТИПЫ ЭЛЕМЕНТОВ ДЛЯ ПЕРВОГО БЛОКА ===== */
        .text-green {
            position: absolute;
            background-color: #00ff00;
            color: #000;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-red {
            position: absolute;
            background-color: #a52a2a;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* ===== ТИПЫ ЭЛЕМЕНТОВ ДЛЯ ВТОРОГО БЛОКА ===== */
        .img-link-orange {
            background-color: #ff6600;
            cursor: pointer;
            width: 81px;
            height: 81px;
            position: relative;
        }

        .text-green-inside-orange {
            position: absolute;
            background-color: #00ff00;
            color: #000;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10px;
        }

        /* Flexbox контейнер для блока 2 */
        .orange-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ===== БЛОК 1 ===== -->
        <div class="blue-image blue-1">
            <!-- 1. Верхний левый зеленый -->
            <div class="text-green" style="top: 18px; left: 18px; width: 105px; height: 35px;">Hello</div>
            
            <!-- 2. Три зеленых справа вверху -->
            <div class="text-green" style="top: 18px; right: 15px; width: 42px; height: 22px;">Hello</div>
            <div class="text-green" style="top: 18px; right: 65px; width: 42px; height: 22px;">Hello</div>
            <div class="text-green" style="top: 18px; right: 115px; width: 42px; height: 22px;">Hello</div>
            
            <!-- 3. Большой зеленый -->
            <div class="text-green" style="top: 150px; left: 18px; width: 130px; height: 80px;">Hello World</div>
            
            <!-- 4. Средний зеленый (под большим) -->
            <div class="text-green" style="top: 238px; left: 18px; width: 130px; height: 30px;">Hello</div>
            
            <!-- 5. Красный (ссылка) -->
            <a href="#" class="link-red" style="top: 275px; left: 18px; width: 100px; height: 25px;">Link</a>
        </div>
        <div class="divider"></div>

        <!-- ===== БЛОК 2 ===== -->
        <div class="blue-image blue-2">
            <div class="orange-container">
                <a href="#" class="img-link-orange" style="top: 0;">
                    <div class="text-green-inside-orange">Hello</div>
                </a>
                <a href="#" class="img-link-orange">
                    <div class="text-green-inside-orange">Hello</div>
                </a>
                <a href="#" class="img-link-orange">
                    <div class="text-green-inside-orange">Hello</div>
                </a>
                <a href="#" class="img-link-orange">
                    <div class="text-green-inside-orange">Hello</div>
                </a>
            </div>
        </div>
        <div class="divider"></div>

        <!-- Блок 3 (пока пустой) -->
        <div class="blue-image blue-3"></div>
        <div class="divider"></div>

        <!-- Блок 4 (пока пустой) -->
        <div class="blue-image blue-4"></div>
        <div class="divider"></div>

        <!-- Блок 5 (пока пустой) -->
        <div class="blue-image blue-5"></div>

    </div>

</body>
</html>
